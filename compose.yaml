services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cert}
      POSTGRES_USER: ${POSTGRES_USER:-cert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set password}
      TZ: Asia/Seoul
    ports: ['127.0.0.1:15406:5432']
    volumes:
      - cert-manager-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
  api:
    # Tagged by commit on the server, so a rollback starts the earlier image (deploy/remote-deploy.sh).
    image: cert-backend:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: backend/Dockerfile, secrets: [npm_token] }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cert}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cert}
      PORT: 3106
      TZ: Asia/Seoul
      # #116: the shared sign-in (sirloinbh/shared-auth) checks each /api session on its network.
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL:-http://shared-auth-api:3110}
      # shared-ai's public key; /internal/tools is served only when it is set (project-standards#711).
      AI_TOOLS_PUBLIC_KEY: ${AI_TOOLS_PUBLIC_KEY:-}
    networks:
      default: {}
      shared-auth: {}
      # shared-ai reads and calls the tools at http://cert-manager-api:3106 (project-standards#611).
      shared-ai: { aliases: [cert-manager-api] }
    depends_on:
      db: { condition: service_healthy }
    # The image has no curl, so node asks the API itself. `docker compose up -d --wait` and web's depends_on use it.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3106/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
  web:
    image: cert-frontend:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: frontend/Dockerfile, secrets: [npm_token] }
    # Local default stays 127.0.0.1:8106; the server sets WEB_BIND/WEB_PORT in .env.
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8106}:80']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  cert-manager-data:
# Created by the shared-auth compose project. Locally, run shared-auth first, or once: docker network create shared-auth
networks:
  shared-auth:
    external: true
  # External so this app and shared-ai deploy in either order; deploy/remote-deploy.sh creates it when missing.
  # Locally, once: docker network create shared-ai
  shared-ai:
    name: shared-ai
    external: true
# The Dockerfiles read the GitHub Packages token as a BuildKit secret, so it never lands in an image layer.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
